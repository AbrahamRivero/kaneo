services:
  watchtower:
    image: containrrr/watchtower
    command:
      - "--label-enable"
      - "--interval"
      - "30"
      - "--rolling-restart"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  traefik:
    image: "traefik:v3.3"
    container_name: "traefik"
    command:
      - "--providers.docker=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - traefik-net
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: palcodesk
      POSTGRES_USER: palcodesk_user
      POSTGRES_PASSWORD: palcodesk_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traefik-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palcodesk_user -d palcodesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/usepalcodesk/api:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`demo-api.palcodesk.app`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.enable-volume-preservation=true"
    environment:
      JWT_ACCESS: "change_me"
      DATABASE_URL: "postgresql://palcodesk_user:palcodesk_password@postgres:5432/palcodesk"
      DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/usepalcodesk/web:latest
    environment:
      KANEO_API_URL: "https://demo-api.palcodesk.app"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`demo.palcodesk.app`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    networks:
      - traefik-net

networks:
  traefik-net:
    driver: bridge

volumes:
  postgres_data:
    name: palcodesk_postgres_data
